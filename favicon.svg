<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Girasol">
  <g transform="translate(32,32)">
    <!-- Capa trasera de pétalos -->
    <g fill="#E5A400">
      <ellipse rx="5" ry="24" transform="rotate(15)" />
      <ellipse rx="5" ry="24" transform="rotate(45)" />
      <ellipse rx="5" ry="24" transform="rotate(75)" />
      <ellipse rx="5" ry="24" transform="rotate(105)" />
      <ellipse rx="5" ry="24" transform="rotate(135)" />
      <ellipse rx="5" ry="24" transform="rotate(165)" />
    </g>
    <!-- Capa delantera de pétalos -->
    <g fill="#FFC933">
      <ellipse rx="5.5" ry="26" transform="rotate(0)" />
      <ellipse rx="5.5" ry="26" transform="rotate(30)" />
      <ellipse rx="5.5" ry="26" transform="rotate(60)" />
      <ellipse rx="5.5" ry="26" transform="rotate(90)" />
      <ellipse rx="5.5" ry="26" transform="rotate(120)" />
      <ellipse rx="5.5" ry="26" transform="rotate(150)" />
    </g>
    <!-- Centro de semillas -->
    <circle r="11.5" fill="#4A2C0F" />
    <circle r="9" fill="none" stroke="#6E4720" stroke-width="1.2" stroke-dasharray="2 2.5" />
    <circle r="5.5" fill="none" stroke="#8C5E2A" stroke-width="1.2" stroke-dasharray="1.8 2.2" />
    <circle r="2" fill="#F5B700" opacity="0.6" />
  </g>
</svg>
