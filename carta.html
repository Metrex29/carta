<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una carta para ti · Carlos &amp; Sofia</title>
  <meta name="description" content="Una carta de Carlos para Sofia.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="pagina-carta">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div id="lluvia" class="lluvia" aria-hidden="true"></div>

  <header class="cabecera">
    <div class="cabecera-interior">
      <a href="index.html" class="monograma cabecera-monograma" data-monograma>C &amp; S</a>
      <nav aria-label="Principal">
        <ul class="menu">
          <li><a href="index.html#galeria">Fotos</a></li>
          <li><a href="carta.html" aria-current="page">Carta</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido" class="contenedor contenedor-estrecho">
    <header class="seccion-cabecera">
      <h1 id="carta-titulo">Una carta para ti</h1>
      <p id="carta-subtitulo" hidden></p>
    </header>

    <section id="carta-foto" class="bloque" aria-label="La carta escrita a mano">
      <figure class="carta-foto">
        <button type="button" id="carta-foto-boton" class="carta-foto-boton" aria-label="Ver la carta en grande">
          <img id="carta-foto-img" src="fotos/carta-foto.svg" alt="La carta escrita a mano">
        </button>
        <figcaption id="carta-foto-pie">Toca la carta para verla en grande.</figcaption>
      </figure>
    </section>

    <section id="carta-texto" class="bloque" aria-label="La carta en texto">
      <article class="carta">
        <p id="carta-saludo" class="carta-saludo">Mi amor,</p>
        <div id="carta-cuerpo-accesible" class="solo-lectores"></div>
        <div id="carta-cuerpo" class="carta-cuerpo" aria-hidden="true"></div>
        <div id="carta-cierre" class="carta-cierre" hidden>
          <p id="carta-despedida">Con todo mi amor,</p>
          <p id="carta-firma" class="carta-firma">Carlos</p>
          <p id="carta-posdata" class="carta-posdata"></p>
        </div>
        <button type="button" id="btn-carta-completa" class="enlace-boton" hidden>Mostrar la carta entera</button>
      </article>
    </section>

    <section id="carta-video" class="bloque" aria-labelledby="video-titulo">
      <h2 id="video-titulo">Nuestro vídeo</h2>
      <p id="video-subtitulo" hidden></p>
      <video id="video" class="video" controls playsinline preload="metadata">
        Tu navegador no puede reproducir este vídeo.
      </video>
    </section>

    <p id="carta-vacia" class="carta-vacia" hidden>Todavía la estoy escribiendo. Vuelve pronto.</p>

    <p class="volver"><a href="index.html#galeria" class="boton">Volver a las fotos</a></p>
  </main>

  <footer class="pie">
    <div class="contenedor pie-interior">
      <p class="monograma" data-monograma>C &amp; S</p>
      <p id="pie-texto" class="pie-texto">Hecho con todo mi amor para ti</p>
      <nav aria-label="Pie">
        <ul class="pie-enlaces">
          <li><a href="index.html#galeria">Fotos</a></li>
          <li><a href="carta.html" aria-current="page">Carta</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <div class="controles">
    <button type="button" id="btn-lluvia" class="control" aria-pressed="false">
      <span aria-hidden="true">♥</span> Corazones
    </button>
    <button type="button" id="btn-musica" class="control" aria-pressed="false" hidden>
      <span aria-hidden="true">♪</span> <span id="btn-musica-texto">Música</span>
    </button>
    <audio id="audio" preload="metadata" loop></audio>
  </div>

  <dialog id="visor" class="visor una-sola" aria-label="Carta ampliada">
    <button type="button" id="visor-cerrar" class="visor-boton visor-cerrar" aria-label="Cerrar">&times;</button>
    <button type="button" id="visor-anterior" class="visor-boton visor-anterior" aria-label="Anterior">&#8249;</button>
    <figure class="visor-figura">
      <img id="visor-img" src="data:," alt="">
      <figcaption>
        <span id="visor-texto"></span>
        <span class="visor-meta"><span id="visor-fecha"></span> <span id="visor-contador"></span></span>
      </figcaption>
    </figure>
    <button type="button" id="visor-siguiente" class="visor-boton visor-siguiente" aria-label="Siguiente">&#8250;</button>
  </dialog>

  <script src="js/config.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
