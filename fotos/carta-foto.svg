  </text>
  <text x="450" y="535" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-size="20" fill="#6E4856">
    y pon su nombre en js/config.js → fotoCarta: "fotos/tu-carta.jpg"
  </text>
